org.gradle.jvmargs=-Xmx3G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
org.gradle.configuration-cache.problems=warn

# ForgeGradle 7 fusionne classes et ressources dans un meme repertoire de
# sortie. Cela remplace le reglage manuel de resourcesDir qui etait necessaire
# avec ForgeGradle 6 pour que Forge voie le mod comme un seul module.
net.minecraftforge.gradle.merge-source-sets=true

## Environnement
minecraft_version=26.2
forge_version=65.1.3
mapping_channel=official
mapping_version=26.2

## Mod
mod_id=dynamicmusic
mod_name=DynamicMusic
mod_version=1.0.0
mod_group_id=com.dynamicmusic
mod_authors=BouBou
mod_license=MIT
